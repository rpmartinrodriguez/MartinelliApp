plugins {
    id 'com.android.application'
}

android {
    namespace 'com.martinelliautos.prueba'
    compileSdk 36

    defaultConfig {
        applicationId 'com.martinelliautos.prueba2'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1-prueba2'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
    }
}

dependencies {
    // Implementación oficial para Trusted Web Activities de Chrome.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
